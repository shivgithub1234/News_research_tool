name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANONYMIZED_TELEMETRY: "False"
      HF_HUB_OFFLINE: "1"
      GROQ_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-private.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q main.py news_research evaluation
  public-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_public_demo -v
